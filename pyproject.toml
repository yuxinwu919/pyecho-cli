[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "pyecho-cli"
version = "0.3.1"
description = "Python CLI toolkit for the ECHO2D electromagnetic wakefield solver"
authors = [{name = "ECHO2D Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "h5py>=3.8",
    "typer>=0.9",
    "rich>=13.0",
    "jinja2>=3.1",
    "pint>=0.22",
    "tqdm>=4.65",
]

[project.urls]
Homepage = "https://echo4d.de"
Repository = "https://github.com/echo4d/echo2d"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pyqtgraph>=0.13", "PySide2>=5.15"]
interactive = ["pyqtgraph>=0.13", "PySide2>=5.15"]

[project.scripts]
echo2d = "pyecho.cli:app"

[tool.setuptools.packages.find]
include = ["pyecho*"]

# ---------------------------------------------------------------------------
# Type checking (mypy)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "pyecho/_cli_monolithic_bak.py",
    "pyecho/cli/",
]

# ---------------------------------------------------------------------------
# Linting (ruff)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "pyecho/_cli_monolithic_bak.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["pyecho"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Code coverage (pytest-cov)
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["pyecho"]
omit = [
    "pyecho/cli/*",
    "pyecho/_cli_monolithic_bak.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short -m \"not integration\""
markers = [
    "integration: tests that run ECHO2D simulations (skipped in CI — needs binary)",
    "matlab: tests that require MATLAB (run locally only)",
]
